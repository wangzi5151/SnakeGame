<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>贪吃蛇 Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
body{background:#0a0a1a;display:flex;justify-content:center;align-items:center}
#app{position:relative;width:100vw;height:100vh;max-width:420px;max-height:750px;display:flex;flex-direction:column;background:#0a0a1a}
.header{display:flex;justify-content:space-between;padding:16px 20px}
.panel{background:rgba(22,33,62,0.8);border-radius:10px;padding:8px 16px;text-align:center}
.panel .label{font-size:10px;color:#534b62;text-transform:uppercase}
.panel .value{font-size:22px;font-weight:700;color:#00f5ff}
.canvas-wrap{flex:1;display:flex;justify-content:center;align-items:center;padding:0 10px}
canvas{border-radius:12px;background:#0f1629;box-shadow:0 0 30px rgba(0,245,255,0.1)}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(10,10,26,0.9);z-index:20}
.overlay.show{display:flex}
.overlay h2{font-size:36px;color:#fff;margin-bottom:10px}
.overlay p{color:rgba(255,255,255,0.5);margin-bottom:25px;font-size:16px}
.overlay .sc{font-size:48px;color:#00f5ff;font-weight:800;margin-bottom:5px}
.overlay button{padding:14px 50px;font-size:18px;color:#fff;background:linear-gradient(135deg,#00f5ff,#0066ff);border:none;border-radius:30px;cursor:pointer;font-weight:700;box-shadow:0 4px 20px rgba(0,245,255,0.3)}
.overlay button:active{transform:scale(0.95)}
.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:6px;padding:10px 10px 20px;justify-content:center}
.dpad .b{background:rgba(22,33,62,0.6);border:1px solid rgba(0,245,255,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.15s}
.dpad .b:active{background:rgba(0,245,255,0.2);transform:scale(0.9)}
.dpad .b.empty{background:transparent;border:none}
</style>
</head>
<body>
<div id="app">
<div class="header">
<div class="panel"><div class="label">分数</div><div class="value" id="score">0</div></div>
<div class="panel"><div class="label">最高</div><div class="value" id="best">0</div></div>
<div class="panel"><div class="label">长度</div><div class="value" id="len">3</div></div>
</div>
<div class="canvas-wrap"><canvas id="c"></canvas></div>
<div class="dpad">
<div class="b empty"></div><div class="b" id="upBtn">▲</div><div class="b empty"></div>
<div class="b" id="leftBtn">◀</div><div class="b empty"></div><div class="b" id="rightBtn">▶</div>
<div class="b empty"></div><div class="b" id="downBtn">▼</div><div class="b empty"></div>
</div>
<div class="overlay" id="startScreen">
<h2>🐍 贪吃蛇</h2><p>SNAKE</p><button id="startBtn">开始游戏</button>
</div>
<div class="overlay" id="overScreen">
<h2>游戏结束</h2><div class="sc" id="finalScore">0</div><p id="overMsg"></p><button id="restartBtn">再来一次</button>
</div>
</div>

<script>
(function(){
"use strict";

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const app=document.getElementById("app");

const CELL=18;
let COLS,ROWS;
let snake=[],dir={x:1,y:0},nextDir={x:1,y:0};
let food=null,specialFood=null,specialTimer=0;
let score=0,best=parseInt(localStorage.getItem("snakeBest")||"0");
let state="menu",speed=120,moveTimer=0;
let particles=[];

function resize(){
  const wrap=app.querySelector(".canvas-wrap");
  const r=wrap.getBoundingClientRect();
  COLS=Math.floor((r.width-20)/CELL);
  ROWS=Math.floor((r.height-20)/CELL);
  canvas.width=COLS*CELL;canvas.height=ROWS*CELL;
  canvas.style.width=COLS*CELL+"px";canvas.style.height=ROWS*CELL+"px";
}

function init(){
  resize();
  const cx=Math.floor(COLS/2),cy=Math.floor(ROWS/2);
  snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;speed=120;moveTimer=0;
  particles=[];specialFood=null;specialTimer=0;
  document.getElementById("score").textContent="0";
  document.getElementById("len").textContent="3";
  spawnFood();
  state="playing";
}

function spawnFood(){
  let pos;
  do{pos={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food=pos;
}

function spawnSpecial(){
  let pos;
  do{pos={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y)||(pos.x===food.x&&pos.y===food.y));
  specialFood=pos;specialTimer=100;
}

function addParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    particles.push({x:x*CELL+CELL/2,y:y*CELL+CELL/2,
      vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,
      life:1,decay:Math.random()*0.04+0.02,
      size:Math.random()*4+2,color});
  }
}

function update(dt){
  if(state!=="playing")return;
  moveTimer+=dt;
  if(moveTimer<speed)return;
  moveTimer=0;
  dir={...nextDir};
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){die();return;}
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){die();return;}
  snake.unshift(head);
  let ate=false;
  if(food&&head.x===food.x&&head.y===food.y){
    score+=10;ate=true;
    addParticles(food.x,food.y,"#ff6b6b",10);
    spawnFood();
    if(Math.random()<0.3&&!specialFood)spawnSpecial();
    speed=Math.max(50,120-score);
  }else if(specialFood&&head.x===specialFood.x&&head.y===specialFood.y){
    score+=30;ate=true;
    addParticles(specialFood.x,specialFood.y,"#ffd700",20);
    specialFood=null;specialTimer=0;
  }
  if(!ate)snake.pop();
  if(specialFood){specialTimer--;if(specialTimer<=0)specialFood=null;}
  document.getElementById("score").textContent=score;
  document.getElementById("len").textContent=snake.length;
  if(score>best){best=score;localStorage.setItem("snakeBest",best);document.getElementById("best").textContent=best;}
}

function die(){
  state="dead";
  snake.forEach(s=>addParticles(s.x,s.y,"#00f5ff",5));
  document.getElementById("finalScore").textContent=score;
  document.getElementById("overMsg").textContent="长度: "+snake.length;
  setTimeout(()=>document.getElementById("overScreen").classList.add("show"),400);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#0f1629";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="rgba(0,245,255,0.03)";
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,ROWS*CELL);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(COLS*CELL,y*CELL);ctx.stroke();}
  if(food){
    ctx.shadowColor="#ff6b6b";ctx.shadowBlur=15;
    ctx.fillStyle="#ff6b6b";
    ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  if(specialFood){
    const pulse=Math.sin(Date.now()*0.01)*3;
    ctx.shadowColor="#ffd700";ctx.shadowBlur=20+pulse;
    ctx.fillStyle="#ffd700";
    ctx.beginPath();ctx.arc(specialFood.x*CELL+CELL/2,specialFood.y*CELL+CELL/2,CELL/2-1+pulse,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#fff";ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("★",specialFood.x*CELL+CELL/2,specialFood.y*CELL+CELL/2);
  }
  snake.forEach((s,i)=>{
    const t=i/snake.length;
    const r=Math.floor(lerp(0,245,t));
    const g=Math.floor(lerp(245,100,t));
    const b=Math.floor(lerp(255,255,t));
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    if(i===0){
      ctx.shadowColor="#00f5ff";ctx.shadowBlur=10;
    }
    const pad=i===0?1:2;
    ctx.beginPath();
    ctx.roundRect(s.x*CELL+pad,s.y*CELL+pad,CELL-pad*2,CELL-pad*2,i===0?5:4);
    ctx.fill();
    ctx.shadowBlur=0;
    if(i===0){
      ctx.fillStyle="#0a0a1a";
      const ex1=s.x*CELL+CELL*0.3,ey1=s.y*CELL+CELL*0.35;
      const ex2=s.x*CELL+CELL*0.7,ey2=s.y*CELL+CELL*0.35;
      if(dir.x===1){ctx.beginPath();ctx.arc(s.x*CELL+CELL*0.65,s.y*CELL+CELL*0.35,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s.x*CELL+CELL*0.65,s.y*CELL+CELL*0.65,2,0,Math.PI*2);ctx.fill();}
      else if(dir.x===-1){ctx.beginPath();ctx.arc(s.x*CELL+CELL*0.35,s.y*CELL+CELL*0.35,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s.x*CELL+CELL*0.35,s.y*CELL+CELL*0.65,2,0,Math.PI*2);ctx.fill();}
      else if(dir.y===-1){ctx.beginPath();ctx.arc(s.x*CELL+CELL*0.35,s.y*CELL+CELL*0.35,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s.x*CELL+CELL*0.65,s.y*CELL+CELL*0.35,2,0,Math.PI*2);ctx.fill();}
      else{ctx.beginPath();ctx.arc(s.x*CELL+CELL*0.35,s.y*CELL+CELL*0.65,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s.x*CELL+CELL*0.65,s.y*CELL+CELL*0.65,2,0,Math.PI*2);ctx.fill();}
    }
  });
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

function lerp(a,b,t){return a+(b-a)*t}

function tick(time){
  const dt=time-lastTime;lastTime=time;
  update(dt);
  draw();
  requestAnimationFrame(tick);
}

let lastTime=0;
document.addEventListener("keydown",e=>{
  const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
  const d=map[e.key];
  if(d&&!(d.x===-dir.x&&d.y===-dir.y)){e.preventDefault();nextDir=d;}
});

let tx=0,ty=0;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  let d;
  if(Math.abs(dx)>Math.abs(dy))d=dx>0?{x:1,y:0}:{x:-1,y:0};
  else d=dy>0?{x:0,y:1}:{x:0,y:-1};
  if(!(d.x===-dir.x&&d.y===-dir.y))nextDir=d;
},{passive:true});

document.getElementById("upBtn").addEventListener("click",()=>{if(dir.y!==1)nextDir={x:0,y:-1};});
document.getElementById("downBtn").addEventListener("click",()=>{if(dir.y!==-1)nextDir={x:0,y:1};});
document.getElementById("leftBtn").addEventListener("click",()=>{if(dir.x!==1)nextDir={x:-1,y:0};});
document.getElementById("rightBtn").addEventListener("click",()=>{if(dir.x!==-1)nextDir={x:1,y:0};});

document.getElementById("startBtn").addEventListener("click",()=>{document.getElementById("startScreen").classList.remove("show");init();});
document.getElementById("restartBtn").addEventListener("click",()=>{document.getElementById("overScreen").classList.remove("show");init();});

document.getElementById("best").textContent=best;
resize();window.addEventListener("resize",resize);
requestAnimationFrame(tick);

})();
</script>
</body>
</html>
